<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Dutch Bros Redesign &mdash; Design Comps</title>
        <style>
            :root {
                --black: #12252b;
                --off-black: #384b52;
                --blue: #7eaecd;
                --off-white: #efefef;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: var(--black);
                color: var(--off-white);
                font-family: "Poppins", "Helvetica Neue", Arial, sans-serif;
                line-height: 1.6;
                padding: 4rem 1.5rem 6rem;
            }
            .wrap {
                max-width: 1100px;
                margin: 0 auto;
            }
            .back {
                display: inline-block;
                color: var(--blue);
                text-decoration: none;
                font-size: 0.9rem;
                letter-spacing: 0.15rem;
                text-transform: uppercase;
                margin-bottom: 2rem;
            }
            .back:hover {
                text-decoration: underline;
            }
            h1 {
                font-size: 2rem;
                letter-spacing: 0.2rem;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
            }
            .lead {
                color: var(--off-white);
                opacity: 0.8;
                max-width: 640px;
                margin-bottom: 3rem;
            }
            .comp {
                margin-bottom: 3rem;
            }
            .comp__label {
                color: var(--blue);
                font-size: 0.85rem;
                letter-spacing: 0.25rem;
                text-transform: uppercase;
                margin-bottom: 0.75rem;
            }
            .comp__image {
                width: 100%;
                height: auto;
                display: block;
                border-radius: 0.4rem;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
        </style>
    </head>
    <body>
        <div class="wrap">
            <a class="back" href="/#projects">&laquo; Back to portfolio</a>
            <h1>Dutch Bros Redesign</h1>
            <p class="lead">
                A usability study and full visual redesign of the Dutch Bros
                site. Below are the four page comps produced in Photoshop:
                home, menu, shop, and our story.
            </p>

            <figure class="comp">
                <figcaption class="comp__label">Home</figcaption>
                <img class="comp__image" src="/dutchbros/home.jpg" alt="Dutch Bros home page design comp" />
            </figure>
            <figure class="comp">
                <figcaption class="comp__label">Menu</figcaption>
                <img class="comp__image" src="/dutchbros/menu.jpg" alt="Dutch Bros menu page design comp" />
            </figure>
            <figure class="comp">
                <figcaption class="comp__label">Shop</figcaption>
                <img class="comp__image" src="/dutchbros/shop.jpg" alt="Dutch Bros shop page design comp" />
            </figure>
            <figure class="comp">
                <figcaption class="comp__label">Our Story</figcaption>
                <img class="comp__image" src="/dutchbros/our-story.jpg" alt="Dutch Bros our story page design comp" />
            </figure>
        </div>
    </body>
</html>
